name: Build JobPortal Android App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Extract Android Project
        run: unzip -q JobPortal_Native_Android_Source.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/JobPortalAndroid :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JobPortal-APK
          path: source/JobPortalAndroid/app/build/outputs/apk/debug/app-debug.apk
